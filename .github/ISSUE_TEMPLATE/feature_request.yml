name: Feature request
description: Propose a new delivery behaviour, configuration or piece of infrastructure.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a sender or a receiver cannot do today, or which failure mode is not covered.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want, including what happens to a message on a retry, on a crash and when the dead-letter queue is unreachable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked "Possible next steps" in the README and the technical debt in .context/docs/tech-debt.md
          required: true
